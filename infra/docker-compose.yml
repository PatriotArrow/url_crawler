services:
  kafka-broker:
    container_name: kafka-node-1
    ports:
      - "9092:9092"
      - "29092:29092"
      - "9093:9093"
    networks:
      - crawler-network
    image: confluentinc/cp-kafka:7.8.1
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      #KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      #KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker:9092
      #PLAINTEXT is for other containers, and they connext to kafka-broker:9092
      #PLAINTEXT_HOST is for host machine, and they connect to localhost:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      #KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
  redis:
    container_name: redis
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - crawler-network
    volumes:
      - redis_data:/data
      

  postgres:
    container_name: postgres
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: crawler_db
      POSTGRES_USER: crawler_user 
      POSTGRES_PASSWORD: crawler_pass
    networks:
      - crawler-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
  #docker exec -it postgres psql -U crawler_user -d crawler_db 

  api-service:
    container_name: api-service
    build:
      context: ../services/api-service
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - crawler-network
    environment:
      DB_HOST: postgres
      DB_USERNAME: crawler_user
      DB_PASSWORD: crawler_pass
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker:9092
    depends_on:
      kafka-broker:
        condition: service_healthy
      postgres:
        condition: service_started

  crawler-worker:
    container_name: crawler-worker
    build:
      context: ../services/crawler-worker
      dockerfile: Dockerfile
    networks:
      - crawler-network
    environment:
      DB_HOST: postgres
      DB_USERNAME: crawler_user
      DB_PASSWORD: crawler_pass
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      kafka-broker:
        condition: service_healthy
      postgres:
        condition: service_started
      redis:
        condition: service_started

  result-processor:
    container_name: result-processor
    build:
      context: ../services/result-processor
      dockerfile: Dockerfile
    networks:
      - crawler-network
    environment:
      DB_HOST: postgres
      DB_USERNAME: crawler_user
      DB_PASSWORD: crawler_pass
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker:9092
    depends_on:
      kafka-broker:
        condition: service_healthy
      postgres:
        condition: service_started
networks:
  crawler-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: